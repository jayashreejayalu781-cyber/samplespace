<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }
      body {
        width: 100%;
        height: 100vh;
      }
      .nav {
        width: 100%;
        height: 80px;
        display: flex;
        justify-content: space-between;
        padding: 0px 30px;
        align-items: center;
      }
      .logo {
        width: 80px;
        height: 80%;
        background-color: black;
      }
      .nav-sub-1 ul {
        list-style: none;
        display: flex;
        align-items: center;
        gap: 30px;
        padding: 15px 40px;
        border: none;
        background-color: black;
        color: white;
        border-radius: 25px;
      }
      .nav-sub-1 ul li {
        transition: all 0.25s ease-in-out;
      }
      .nav-sub-1 ul li:hover {
        transform: scale(1.08);
      }
      .nav-sub-2 ul {
        list-style: none;
        display: flex;
        align-items: center;
        gap: 15px;
        border: none;
        background-color: black;
        color: white;
        padding: 10px 20px;
        border-radius: 20px;
      }
      .nav-sub-2 ul li {
        transition: all 0.25s ease-in-out;
      }
      .nav-sub-2 ul li:hover {
        transform: scale(1.2);
      }
      .login {
        width: 100%;
        height: 80%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .login-sub {
        width: 30%;
        height: 90%;
        background-color: black;
        color: white;
        padding: 15px;
        border-radius: 40px;
        display: flex;
        flex-direction: column;
        gap: 30px;
      }
      .login-sub h2 {
        font-weight: 600;
        font-size: 30px;
      }
      .login-minor-sub-1 {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .login-minor-sub-1 input {
        width: 100%;
        padding: 10px;
        border-radius: 20px;
        border: none;
      }
      .login-button {
        padding: 10px 20px;
        background-color: white;
        border: none;
        border-radius: 10px;
        transition: all 0.25s ease-in-out;
      }
      .login-button:hover {
        transform: scale(1.05);
      }
      .login-minor-sub-2 {
        display: flex;
        justify-content: center;
      }
      .login-register {
        display: flex;
        justify-content: center;
      }
      .login-minor-sub-1 p {
        margin-bottom: 10px;
      }
      .password-inputs {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div class="nav">
      <div class="logo"></div>
      <div class="nav-sub-1">
        <ul>
          <li class="home">Home</li>
          <li>Mentors</li>
          <li>Universities</li>
        </ul>
      </div>
      <div class="nav-sub-2">
        <ul>
          <li><i class="ri-search-line"></i></li>
          <li class="account"><i class="ri-user-line"></i></li>
          <li><i class="ri-global-line"></i></li>
        </ul>
      </div>
    </div>

    <div class="login">
      <div class="login-sub">
        <h2>Register Now!</h2>
        <div class="login-minor-sub-1">
          <div class="username">
            <p>Username</p>
            <input type="text" placeholder="Enter your username" />
          </div>
          <div class="password">
            <p>password</p>
            <div class="password-inputs">
              <input
                type="password"
                placeholder="Enter your password"
                class="password-1"
              />
              <input
                type="password"
                placeholder="Re-enter your password"
                class="password-2"
              />
            </div>
          </div>
        </div>
        <div class="login-minor-sub-2">
          <button class="login-button">Get started</button>
        </div>
        <div class="login-register">
          <p class="register"></p>
        </div>
      </div>
    </div>
    <script>
      let home = document.querySelector(".home");
      let register = document.querySelector(".register");
      let username = document.querySelector(".username");
      let password = document.querySelector(".password-1");
      let repassword = document.querySelector(".password-2");
      let account = document.querySelector(".account");
      let correctCredentials = true;
      let getStarted = document.querySelector(".login-button");
      getStarted.addEventListener("click", () => {
        if (
          username.value != "" &&
          password.value != "" &&
          repassword.value != "" &&
          password.value == repassword.value
        ) {
          register.innerHTML = "Welcome User";
          register.style.display = "block";
          window.location.href = "Home.html";
        } else {
          register.innerHTML = "Invalid Credentials";
          register.style.display = "block";
        }
      });

      home.addEventListener("click", () => {
        window.location.href = "Home.html";
      });
      account.addEventListener("click", () => {
        window.location.href = "login.html";
      });
    </script>
  </body>
</html>
