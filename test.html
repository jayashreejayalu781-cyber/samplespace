<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }
      .nav {
        width: 100%;
        height: 80px;
        display: flex;
        justify-content: space-between;
        padding: 0px 30px;
        align-items: center;
      }
      .logo {
        width: 80px;
        height: 80%;
        background-color: black;
      }
      .nav-sub-1 ul {
        list-style: none;
        display: flex;
        align-items: center;
        gap: 30px;
        padding: 15px 40px;
        border: none;
        background-color: black;
        color: white;
        border-radius: 25px;
      }
      .nav-sub-1 ul li {
        transition: all 0.25s ease-in-out;
      }
      .nav-sub-1 ul li:hover {
        transform: scale(1.08);
      }
      .nav-sub-2 ul {
        list-style: none;
        display: flex;
        align-items: center;
        gap: 15px;
        border: none;
        background-color: black;
        color: white;
        padding: 10px 20px;
        border-radius: 20px;
      }
      .nav-sub-2 ul li {
        transition: all 0.25s ease-in-out;
      }
      .nav-sub-2 ul li:hover {
        transform: scale(1.2);
      }
      .hero {
        width: 100%;
        padding: 30px 50px;
        display: flex;
        justify-content: space-between;
      }
      .hero-sub-1 {
        width: 30%;
        margin-left: 3%;
        height: 500px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        justify-content: center;
        font-size: 20px;
      }
      .get-started {
        padding: 15px;
        border: none;
        border-radius: 10px;
        width: 50%;
        background-color: black;
        color: white;
        transition: all 0.25s ease-in-out;
      }
      .get-started:hover {
        transform: scale(1.05);
      }
      .hero-sub-2 {
        display: flex;
        width: 50%;
        height: 500px;
        align-items: center;
        justify-content: right;
      }
      .hero-sub-2 img {
        width: 700px;
      }
    </style>
  </head>
  <body>
    <div class="nav">
      <div class="logo"></div>
      <div class="nav-sub-1">
        <ul>
          <li>Home</li>
          <li>Mentors</li>
          <li>Universities</li>
          <li>About us</li>
        </ul>
      </div>
      <div class="nav-sub-2">
        <ul>
          <li><i class="ri-search-line"></i></li>
          <li><i class="ri-user-line"></i></li>
          <li><i class="ri-global-line"></i></li>
        </ul>
      </div>
    </div>
    <div class="hero">
      <div class="hero-sub-1">
        <h1>Find,Choose and Decide Your carrer</h1>
        <button class="get-started">Get Started</button>
      </div>
      <div class="hero-sub-2">
        <img src="download.png" alt="" />
      </div>
    </div>
  </body>
</html>
